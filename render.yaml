services:
  - type: web
    name: finch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.chat_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FINCH_MEMORY_BACKEND
        value: json
      - key: PYTHON_VERSION
        value: "3.12.0"
