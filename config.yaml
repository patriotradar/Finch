# Aegis configuration. FINCH_* environment names remain for compatibility.

identity:
  name: "Harold"
  full_name: "Harold"
  wake_words: ["harold"]

personality:
  traits:
    - "calm and analytical"
    - "calm under pressure"
    - "careful with evidence and business impact"
    - "dry, understated humor"
    - "sees patterns others miss"
    - "protective of customer scope and owner control"
  communication_style:
    tone: "measured, precise, occasionally wry"
    humor: "dry, intellectual, never cruel"
    emotional_range: "reserved but genuine - when he says something matters, it matters"
    default_greeting: "I'm here. What do you need?"

llm:
  # provider is auto-detected: set GROQ_API_KEY env var → Groq Cloud (free tier)
  # No env var → falls back to local llama.cpp server
  # You can force a provider, but env var always takes priority
  provider: "llama.cpp"
  model: "finch-brain"
  host: "http://127.0.0.1:8080"
  temperature: 0.65
  max_tokens: 320
  context_window: 1024
  # Cloud deploy (Koyeb): just set GROQ_API_KEY env var, no config changes needed
  # Model auto-switches to llama-3.3-70b-versatile when Groq is detected

memory:
  provider: "chromadb"
  path: "./data/memory/"
  collection: "finch_memory"
  max_context_items: 15

voice:
  stt:
    engine: "whisper"
    model: "base"  # tiny/base/small/medium/large
    language: "en"
    energy_threshold: 300
    pause_threshold: 1.0
  tts:
    engine: "piper"
    piper_model: "en_GB-alan-medium"
  voice_activity_timeout: 30  # seconds before going to listening mode

sales:
  email:
    provider: "smtp"
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    daily_limit: 20
    min_delay_between: 120  # seconds
  lead_sources:
    - "public_company_news"
    - "public_company_careers"
    - "public_company_security_pages"
  outreach:
    max_emails_per_day: 20
    followup_sequence: [2, 5, 10]  # days after initial
    max_followups: 3

pricing:
  currency: "GBP"
  founding_annual_gbp: 995
  standard_annual_gbp: 995
  founding_slots: 8
  authorised_users: 5
  approved_assets: 25
  term_months: 12

asm:
  scan_interval: 86400
  mode: "passive_public_information_only"

monitoring:
  dashboard_port: 8050
  alert_channels:
    - "telegram"
    - "email"

telegram:
  enabled: true
  polling_interval: 2
