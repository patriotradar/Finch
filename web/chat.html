<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aegis">
<meta name="description" content="Talk to Kane — technical co-founder at Aegis. Continuous external attack-surface monitoring.">
<link rel="manifest" href="/manifest.json">
<title>Aegis — Talk to Kane</title>
<style>
  :root {
    --bg:#07070b; --bg2:#0c0c12; --bg3:#12121a; --line:#1f1f2c; --line2:#2a2a3a;
    --text:#f2f2f7; --muted:#8b8b9a; --dim:#5c5c6e; --green:#34d399; --blue:#3b82f6;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  }
  .app{
    height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;
    background:radial-gradient(900px 420px at 50% -8%,rgba(52,211,153,.1),transparent 55%),var(--bg2);
  }
  @media(min-width:900px){
    body{display:flex;align-items:center;justify-content:center;background:#030306}
    .app{
      height:min(880px,96vh);border-radius:24px;border:1px solid var(--line);
      box-shadow:0 40px 120px rgba(0,0,0,.55);overflow:hidden;
    }
  }
  header{
    padding:14px 18px;padding-top:max(14px,var(--safe-t));
    display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--line);
    background:rgba(7,7,11,.88);backdrop-filter:blur(14px);z-index:2;
  }
  .avatar{
    width:44px;height:44px;border-radius:14px;
    background:linear-gradient(145deg,#065f46,#34d399);
    display:grid;place-items:center;font-weight:800;color:#04120c;font-size:18px;
    box-shadow:0 0 24px rgba(52,211,153,.28);flex-shrink:0;
  }
  .info{min-width:0;flex:1}
  .info h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .info p{font-size:12px;color:var(--muted);margin-top:2px}
  .live{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;
    color:var(--green);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.25);
    padding:6px 10px;border-radius:999px;flex-shrink:0;
  }
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  #msgs{
    flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .bubble{
    max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;animation:in .18s ease-out;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bubble.you{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
  .bubble.finch{align-self:flex-start;background:var(--bg3);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble .who{font-size:10px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .status{align-self:center;font-size:12px;color:var(--dim);padding:4px 10px}
  .typing{align-self:flex-start;display:inline-flex;gap:5px;padding:12px 16px;background:var(--bg3);border:1px solid var(--line);border-radius:16px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px}
  .chips button{
    flex-shrink:0;border:1px solid var(--line2);background:var(--bg3);color:var(--muted);
    border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .composer{
    display:flex;gap:8px;padding:10px 14px;padding-bottom:max(12px,var(--safe-b));
    border-top:1px solid var(--line);background:rgba(7,7,11,.98);backdrop-filter:blur(16px);
    flex-shrink:0;z-index:10;
  }
  .app{min-height:100%;}

  .composer input{
    flex:1;border-radius:22px;padding:13px 16px;border:1px solid var(--line2);
    background:var(--bg3);color:var(--text);font-size:16px;outline:none;font-family:inherit;
  }
  .composer input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .composer button{
    width:48px;height:48px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    font-size:18px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;padding:0;
  }
  .composer button:disabled{opacity:.4}
  .composer button.ghost{
    background:var(--bg3);color:var(--muted);border:1px solid var(--line2);
  }
  .composer button.ghost.on{
    background:rgba(52,211,153,.15);color:var(--green);border-color:rgba(52,211,153,.4);
  }
  .composer button.ghost.listening{
    background:rgba(239,68,68,.18);color:#f87171;border-color:rgba(239,68,68,.45);
    animation:pulseMic 1.1s ease-in-out infinite;
  }
  @keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  .composer button svg{width:20px;height:20px;display:block}
  .toast{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);
    background:#1a1a24;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;
    max-width:90%;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;font-size:11px;color:var(--dim);padding:0 16px 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">K</div>
    <div class="info">
      <h1>Kane</h1>
      <p>Technical co-founder · Aegis</p>
    </div>
    <div class="live"><i></i> Online</div>
  </header>
  <div id="msgs"></div>
  <div class="chips" id="chips">
    <button type="button" data-q="What does Aegis actually do?">What do you do?</button>
    <button type="button" data-q="Can you look at our domain?">Check our domain</button>
    <button type="button" data-q="How does pricing work?">Pricing</button>
    <button type="button" data-q="I'm not sure I need this.">I'm not sure</button>
  </div>
  <div class="composer">
    <button type="button" id="speakBtn" class="ghost on" title="Kane speaks replies" aria-label="Toggle Kane voice" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a4.5 4.5 0 0 1 0 7"/><path d="M18.5 5.5a8.5 8.5 0 0 1 0 13"/></svg>
    </button>
    <button type="button" id="micBtn" class="ghost" title="Tap to talk" aria-label="Voice input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
    </button>
    <input id="msg" type="text" placeholder="Message Kane… or tap mic" autocomplete="off" enterkeyhint="send">
    <button type="button" id="send" aria-label="Send">↑</button>
  </div>
  <footer>Aegis · continuous external attack-surface monitoring</footer>
  <div class="toast" id="toast"></div>
</div>
<script>
(function () {
  const pid = localStorage.getItem('finch_pid') || ('p-' + Math.random().toString(36).slice(2, 12));
  localStorage.setItem('finch_pid', pid);
  const msgs = document.getElementById('msgs');
  const input = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('micBtn');
  const speakBtn = document.getElementById('speakBtn');
  const toastEl = document.getElementById('toast');
  let busy = false;
  let speakOn = localStorage.getItem('aegis_speak') !== '0';
  let listening = false, rec = null, finalText = '';
  function toast(t) {
    if (!toastEl) return;
    toastEl.textContent = t; toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function stopSpeaking() { try { speechSynthesis.cancel(); } catch (e) {} }
  function speakKane(text) {
    if (!speakOn || !window.speechSynthesis || !text) return;
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
    u.rate = 1.02; u.pitch = 0.95; u.lang = 'en-US';
    const pick = () => {
      const voices = speechSynthesis.getVoices() || [];
      const pref = voices.find(v => /en(-|_)?US/i.test(v.lang) && /Daniel|Alex|Fred|Google US English|male/i.test(v.name))
        || voices.find(v => /en(-|_)US/i.test(v.lang))
        || voices.find(v => /^en/i.test(v.lang));
      if (pref) u.voice = pref;
      speechSynthesis.speak(u);
    };
    if ((speechSynthesis.getVoices() || []).length) pick();
    else speechSynthesis.onvoiceschanged = pick;
  }
  function setSpeakUI() {
    if (!speakBtn) return;
    speakBtn.classList.toggle('on', speakOn);
    speakBtn.setAttribute('aria-pressed', speakOn ? 'true' : 'false');
  }
  function setMicUI(on) {
    if (!micBtn) return;
    micBtn.classList.toggle('listening', !!on);
  }
  function voiceSupported() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }
  function getRecognizer() {
    if (rec) return rec;
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) return null;
    const r = new Ctor();
    r.continuous = false; r.interimResults = true; r.lang = 'en-US'; r.maxAlternatives = 1;
    r.onstart = () => { listening = true; setMicUI(true); };
    r.onerror = (ev) => {
      listening = false; setMicUI(false);
      const err = (ev && ev.error) || '';
      if (err === 'not-allowed' || err === 'service-not-allowed') toast('Mic blocked — allow microphone');
      else if (err === 'no-speech') toast('No speech heard');
      else if (err && err !== 'aborted') toast('Voice error: ' + err);
    };
    r.onend = () => {
      listening = false; setMicUI(false);
      const t = (finalText || '').trim(); finalText = '';
      if (t) { input.value = t; send(); }
    };
    r.onresult = (ev) => {
      let interim = '', fin = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      if (fin) finalText += fin;
      input.value = (finalText + ' ' + interim).trim();
    };
    rec = r; return r;
  }
  function startListening() {
    if (!voiceSupported()) { toast('Voice needs Chrome or Safari'); return; }
    stopSpeaking();
    const r = getRecognizer(); if (!r) return;
    if (listening) { try { r.stop(); } catch (e) {} return; }
    finalText = '';
    try { r.start(); }
    catch (e) { try { r.stop(); } catch (_) {} setTimeout(() => { try { r.start(); } catch (e2) { toast('Could not start mic'); } }, 200); }
  }
  setSpeakUI();
  if (speakBtn) speakBtn.onclick = () => {
    speakOn = !speakOn; localStorage.setItem('aegis_speak', speakOn ? '1' : '0');
    if (!speakOn) stopSpeaking(); setSpeakUI();
    toast(speakOn ? 'Kane will speak replies' : 'Kane voice off');
  };
  if (micBtn) {
    micBtn.onclick = (e) => { e.preventDefault(); startListening(); };
    if (!voiceSupported()) { micBtn.disabled = true; micBtn.title = 'Speech recognition not available'; }
  }
  function bubble(who, text, status) {
    if (status) {
      const s = document.createElement('div');
      s.className = 'status'; s.textContent = text;
      msgs.appendChild(s); msgs.scrollTop = msgs.scrollHeight; return s;
    }
    const d = document.createElement('div');
    d.className = 'bubble ' + (who === 'you' ? 'you' : 'finch');
    if (who !== 'you') {
      const w = document.createElement('div'); w.className = 'who'; w.textContent = 'Kane'; d.appendChild(w);
    }
    d.appendChild(document.createTextNode(text));
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    if (who !== 'you') speakKane(text);
    return d;
  }
  function typing() {
    const t = document.createElement('div');
    t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>';
    msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight; return t;
  }
  async function api(body) {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ prospect_id: pid }, body)),
    });
    return r.json();
  }
  async function boot() {
    const t = typing();
    try {
      const d = await api({ start: true });
      t.remove();
      bubble('finch', d.content || "Hello. I'm Kane.");
    } catch (e) {
      t.remove();
      bubble('finch', "Connection hitch. Refresh and we'll start again.");
    }
  }
  async function send(text) {
    const t = (text || input.value || '').trim();
    if (!t || busy) return;
    busy = true; sendBtn.disabled = true; input.value = '';
    stopSpeaking();
    bubble('you', t);
    const wait = typing();
    try {
      const d = await api({ content: t, message: t });
      wait.remove();
      bubble('finch', d.content || '…');
    } catch (e) {
      wait.remove();
      bubble('finch', 'Line dropped for a second. Say that again.');
    }
    busy = false; sendBtn.disabled = false; input.focus();
  }
  sendBtn.onclick = () => send();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('chips').querySelectorAll('button').forEach(b => {
    b.onclick = () => send(b.getAttribute('data-q'));
  });
  boot();
})();
</script>
</body>
</html>
