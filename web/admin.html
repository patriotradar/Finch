<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finch">
<link rel="manifest" href="/manifest.json">
<title>Finch — Co-Founder</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0}
  .app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;background:#0c0c14}
  .topbar{padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:#0d0d14;border-bottom:1px solid #1e1e2e;display:flex;justify-content:space-between;align-items:center}
  .topbar h2{font-size:20px;color:#4ade80;letter-spacing:.5px}
  .topbar .sub{font-size:11px;color:#666;margin-top:2px}
  .tabs{display:flex;background:#0d0d14;border-bottom:1px solid #1e1e2e;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:1;min-width:68px;padding:12px 6px;background:none;border:none;color:#666;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:#4ade80;border-bottom-color:#4ade80}
  .badge{display:inline-block;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:top}
  .content{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .card{background:#12121a;border:1px solid #1e1e2e;border-radius:12px;padding:14px;margin-bottom:10px}
  .card h4{font-size:11px;color:#777;margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
  .card .value{font-size:26px;font-weight:700}
  .value.green{color:#4ade80}.value.blue{color:#60a5fa}.value.amber{color:#f59e0b}.value.red{color:#ef4444}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .handoff{border-left:3px solid #f59e0b;padding-left:12px;margin-bottom:10px}
  .handoff h5{font-size:14px;margin-bottom:4px}
  .handoff p{font-size:12px;color:#888}
  .chat-area{display:flex;flex-direction:column;gap:10px;min-height:100%}
  .msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.you{background:#2563eb;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.finch{background:#1a1a2e;color:#e8e8f0;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #2a2a3e}
  .chat-input{display:flex;gap:8px;padding:10px 14px;background:#0d0d14;border-top:1px solid #1e1e2e;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .chat-input input,.compose input,.compose textarea{flex:1;width:100%;padding:12px 14px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:20px;color:#e0e0e0;font-size:16px;outline:none;font-family:inherit}
  .chat-input input:focus,.compose input:focus,.compose textarea:focus{border-color:#2563eb}
  .chat-input button,.btn{background:#2563eb;color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 16px}
  .chat-input button{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex-shrink:0}
  .btn.ghost{background:transparent;border:1px solid #2a2a3e;color:#aaa}
  .btn.green{background:#166534}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:14px}
  .btn.danger{background:#7f1d1d}
  .empty{text-align:center;color:#555;padding:36px 16px;font-size:14px;line-height:1.5}
  .brain-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .brain-dot.online{background:#4ade80;box-shadow:0 0 6px #4ade80}
  .brain-dot.offline{background:#ef4444}
  .mail-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .mail-tabs button{padding:7px 12px;border-radius:16px;border:1px solid #2a2a3e;background:#12121a;color:#999;font-size:12px;cursor:pointer}
  .mail-tabs button.active{background:#1e3a2f;color:#4ade80;border-color:#4ade80}
  .mail-item{cursor:pointer}
  .mail-item .from{font-size:13px;font-weight:600;color:#e8e8f0}
  .mail-item .subj{font-size:13px;color:#ccc;margin-top:2px}
  .mail-item .preview{font-size:12px;color:#666;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mail-item.unread .from,.mail-item.unread .subj{color:#4ade80}
  .meta{font-size:11px;color:#555;margin-top:6px}
  .compose{display:flex;flex-direction:column;gap:8px}
  .compose textarea{min-height:140px;border-radius:12px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#1e1e2e;color:#888;margin-left:6px}
  .pill.queued{color:#f59e0b}.pill.sent{color:#4ade80}.pill.draft{color:#60a5fa}.pill.failed{color:#ef4444}.pill.unread{color:#f87171}.pill.read{color:#888}
  .typing{color:#666;font-size:12px;font-style:italic;align-self:flex-start;padding:0 8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h2>Finch</h2>
      <div class="sub">Your co-founder · always on</div>
    </div>
    <div id="brainStatus"><span class="brain-dot offline"></span><span style="font-size:12px;color:#666">Brain</span></div>
  </div>
  <div class="tabs">
    <button type="button" onclick="switchTab('status')" id="tab-status" class="active">Status</button>
    <button type="button" onclick="switchTab('emails')" id="tab-emails">Emails<span id="mailBadge" class="badge" style="display:none">0</span></button>
    <button type="button" onclick="switchTab('handoffs')" id="tab-handoffs">Handoffs</button>
    <button type="button" onclick="switchTab('docs')" id="tab-docs">Docs</button>
    <button type="button" onclick="switchTab('chat')" id="tab-chat">Chat</button>
  </div>
  <div id="content" class="content"></div>
  <div id="chatInput" class="chat-input" style="display:none">
    <input type="text" id="chatMsg" placeholder="Talk to Harold..." onkeypress="if(event.key==='Enter')sendChat()" autocomplete="off">
    <button type="button" onclick="sendChat()" aria-label="Send">&#9654;</button>
  </div>
</div>
<script>
  let currentTab = 'status';
  let mailFolder = 'inbox';
  let chatBootstrapped = false;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function switchTab(t) {
    currentTab = t;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    document.getElementById('chatInput').style.display = t === 'chat' ? 'flex' : 'none';
    renderTab(t);
  }

  async function api(url, opts) {
    const r = await fetch(url, opts);
    return r.json();
  }

  function setBrain(online) {
    const bd = document.getElementById('brainStatus');
    if (!bd) return;
    bd.innerHTML = online
      ? '<span class="brain-dot online"></span><span style="font-size:12px;color:#4ade80">Online</span>'
      : '<span class="brain-dot offline"></span><span style="font-size:12px;color:#ef4444">Offline</span>';
  }

  function setMailBadge(n) {
    const b = document.getElementById('mailBadge');
    if (!b) return;
    if (n > 0) { b.style.display = 'inline-block'; b.textContent = n; }
    else b.style.display = 'none';
  }

  async function renderTab(t) {
    const c = document.getElementById('content');
    if (t === 'status') {
      try {
        const d = await api('/api/admin/dashboard');
        setBrain(!!d.brain_online);
        const mail = d.mail || {};
        setMailBadge(mail.unread || 0);
        c.innerHTML =
          '<div class="grid">' +
          '<div class="card"><h4>Brain</h4><div class="value ' + (d.brain_online ? 'green' : 'red') + '">' + (d.brain_online ? 'Online' : 'Offline') + '</div></div>' +
          '<div class="card"><h4>Live chats</h4><div class="value blue">' + (d.active_conversations || 0) + '</div></div>' +
          '<div class="card"><h4>Handoffs</h4><div class="value amber">' + ((d.pending_handoffs || []).length) + '</div></div>' +
          '<div class="card"><h4>MRR</h4><div class="value green">$' + Number(d.mrr || 0).toLocaleString() + '</div></div>' +
          '</div>' +
          '<div class="card"><h4>Mail</h4><div style="font-size:13px;line-height:1.6">' +
          'Inbox <b>' + (mail.inbox || 0) + '</b> · Unread <b style="color:#f87171">' + (mail.unread || 0) + '</b><br>' +
          'Drafts <b>' + (mail.drafts || 0) + '</b> · Outbox <b>' + (mail.outbox || 0) + '</b> · Sent <b>' + (mail.sent || 0) + '</b>' +
          '<div class="meta">' + esc((d.mail_config || {}).note || '') + '</div></div></div>' +
          '<div class="card"><h4>Clients · ' + (d.active_clients || 0) + '</h4>' + (
            (d.clients || []).length
              ? d.clients.map(function (cl) {
                  return '<p style="margin:6px 0;font-size:13px">' + esc(cl.company) + ' — ' + esc(cl.email) + ' — $' + Number(cl.price || 0).toLocaleString() + '/mo</p>';
                }).join('')
              : '<p style="color:#666;font-size:13px">No active clients yet.</p>'
          ) + '</div>' +
          '<div class="card"><h4>Memories</h4><div class="value">' + (d.memory_count || 0) + '</div></div>';
      } catch (e) {
        c.innerHTML = '<div class="empty">Could not load dashboard.</div>';
      }
    } else if (t === 'emails') {
      await renderEmails(null);
    } else if (t === 'handoffs') {
      try {
        const d = await api('/api/admin/dashboard');
        if (!(d.pending_handoffs || []).length) {
          c.innerHTML = '<div class="empty">No pending handoffs.<br>When a prospect says yes on the public chat, they appear here.</div>';
          return;
        }
        c.innerHTML = d.pending_handoffs.map(function (p) {
          return '<div class="card handoff"><h5>' + esc(p.company) + '</h5><p>' + esc(p.email) + ' · $' + Number(p.price || 0).toLocaleString() + '/mo</p></div>';
        }).join('');
      } catch (e) {
        c.innerHTML = '<div class="empty">Error loading handoffs.</div>';
      }
    } else if (t === 'docs') {
      try {
        const d = await api('/api/admin/dashboard');
        if (!(d.documents || []).length) {
          c.innerHTML = '<div class="empty">No documents yet.<br>Contracts and one-pagers land here.</div>';
          return;
        }
        c.innerHTML = d.documents.map(function (doc) {
          return '<div class="card"><h4>#' + esc(doc.id) + ' · ' + esc(doc.name) + '</h4><p style="font-size:12px;color:#888">Tags: ' + esc((doc.tags || []).join(', ') || 'none') + '</p></div>';
        }).join('');
      } catch (e) {
        c.innerHTML = '<div class="empty">Error loading documents.</div>';
      }
    } else if (t === 'chat') {
      c.innerHTML = '<div class="chat-area" id="chatMsgs"></div>';
      connectChat();
    }
  }

  async function renderEmails(openId) {
    const c = document.getElementById('content');
    try {
      const d = await api('/api/admin/emails?folder=' + encodeURIComponent(mailFolder));
      const s = d.summary || {};
      const cfg = d.config || {};
      setMailBadge(s.unread || 0);

      if (openId) {
        const full = await api('/api/admin/emails/' + encodeURIComponent(openId));
        const m = full.message;
        if (!m) { mailFolder = 'inbox'; return renderEmails(null); }
        var actions = '';
        if (m.folder === 'drafts' || m.folder === 'outbox') {
          actions += '<button type="button" class="btn green sm" data-send="' + esc(m.id) + '">Send / Queue</button>';
        }
        actions += '<button type="button" class="btn danger sm" data-del="' + esc(m.id) + '">Delete</button>';
        c.innerHTML =
          '<div class="row" style="margin-bottom:10px"><button type="button" class="btn ghost sm" id="mailBack">← Back</button></div>' +
          '<div class="card">' +
          '<div style="font-size:14px;font-weight:600">' + esc(m.from) + ' → ' + esc(m.to) + '</div>' +
          '<div style="font-size:16px;margin:8px 0;font-weight:600">' + esc(m.subject) + '</div>' +
          '<span class="pill ' + esc(m.status || '') + '">' + esc(m.status || m.folder) + '</span>' +
          (m.company ? '<span class="pill">' + esc(m.company) + '</span>' : '') +
          '<pre style="white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.55;margin-top:14px;color:#ddd">' + esc(m.body) + '</pre>' +
          '<div class="meta">' + esc(m.created_at || '') + '</div>' +
          '<div class="row" style="margin-top:14px">' + actions + '</div></div>';
        document.getElementById('mailBack').onclick = function () { renderEmails(null); };
        c.querySelectorAll('[data-send]').forEach(function (btn) {
          btn.onclick = function () { sendMail(btn.getAttribute('data-send')); };
        });
        c.querySelectorAll('[data-del]').forEach(function (btn) {
          btn.onclick = function () { delMail(btn.getAttribute('data-del')); };
        });
        return;
      }

      var folders = ['inbox', 'drafts', 'outbox', 'sent', 'all'];
      var html = '<div class="card" style="padding:10px 14px"><div style="font-size:12px;color:#888;line-height:1.5">' + esc(cfg.note || '') +
        (cfg.from_address ? '<br>From: <b style="color:#aaa">' + esc(cfg.from_address) + '</b>' : '') + '</div></div>';
      html += '<div class="mail-tabs">';
      folders.forEach(function (f) {
        var label = f.charAt(0).toUpperCase() + f.slice(1);
        if (f === 'inbox' && s.unread) label += ' · ' + s.unread;
        html += '<button type="button" class="' + (mailFolder === f ? 'active' : '') + '" data-folder="' + f + '">' + label + '</button>';
      });
      html += '</div>';
      html += '<div class="card compose"><h4>Compose outreach</h4>' +
        '<input id="cCompany" placeholder="Company (e.g. Acme Corp)">' +
        '<input id="cTo" placeholder="To email" inputmode="email">' +
        '<input id="cFinding" placeholder="Optional finding / hook">' +
        '<div class="row">' +
        '<button type="button" class="btn sm" id="btnCraft">Draft with Harold</button>' +
        '<button type="button" class="btn ghost sm" id="btnManual">Manual</button></div>' +
        '<div id="manualBox" style="display:none;flex-direction:column;gap:8px;margin-top:8px">' +
        '<input id="cSubj" placeholder="Subject">' +
        '<textarea id="cBody" placeholder="Body"></textarea>' +
        '<button type="button" class="btn green sm" id="btnSaveDraft">Save draft</button></div></div>';

      var msgs = d.messages || [];
      if (!msgs.length) {
        html += '<div class="empty">No messages in ' + esc(mailFolder) + '.</div>';
      } else {
        msgs.forEach(function (m) {
          var unread = m.status === 'unread' ? ' unread' : '';
          var who = m.folder === 'inbox' ? m.from : m.to;
          html += '<div class="card mail-item' + unread + '" data-open="' + esc(m.id) + '">' +
            '<div class="from">' + esc(who) +
            '<span class="pill ' + esc(m.status || m.folder) + '">' + esc(m.status || m.folder) + '</span></div>' +
            '<div class="subj">' + esc(m.subject) + '</div>' +
            '<div class="preview">' + esc(String(m.body || '').replace(/\s+/g, ' ').slice(0, 100)) + '</div>' +
            '<div class="meta">' + esc((m.company || '') + (m.created_at ? ' · ' + String(m.created_at).slice(0, 16) : '')) + '</div></div>';
        });
      }
      c.innerHTML = html;

      c.querySelectorAll('[data-folder]').forEach(function (btn) {
        btn.onclick = function () { mailFolder = btn.getAttribute('data-folder'); renderEmails(null); };
      });
      c.querySelectorAll('[data-open]').forEach(function (el) {
        el.onclick = function () { renderEmails(el.getAttribute('data-open')); };
      });
      var bc = document.getElementById('btnCraft');
      if (bc) bc.onclick = craftMail;
      var bm = document.getElementById('btnManual');
      if (bm) bm.onclick = function () {
        var box = document.getElementById('manualBox');
        if (box) box.style.display = box.style.display === 'none' ? 'flex' : 'none';
      };
      var bs = document.getElementById('btnSaveDraft');
      if (bs) bs.onclick = saveManualDraft;
    } catch (e) {
      console.error(e);
      c.innerHTML = '<div class="empty">Could not load mail.</div>';
    }
  }

  async function craftMail() {
    var company = document.getElementById('cCompany').value.trim();
    var to = document.getElementById('cTo').value.trim();
    var finding = document.getElementById('cFinding').value.trim();
    if (!to) { alert('Need an email address'); return; }
    await api('/api/admin/emails', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'craft', company: company, to: to, finding: finding })
    });
    mailFolder = 'drafts';
    renderEmails(null);
  }

  async function saveManualDraft() {
    var to = document.getElementById('cTo').value.trim();
    var subject = document.getElementById('cSubj').value.trim();
    var body = document.getElementById('cBody').value;
    var company = document.getElementById('cCompany').value.trim();
    if (!to) { alert('Need an email address'); return; }
    await api('/api/admin/emails', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'draft', to: to, subject: subject, body: body, company: company })
    });
    mailFolder = 'drafts';
    renderEmails(null);
  }

  async function sendMail(id) {
    var r = await api('/api/admin/emails/' + encodeURIComponent(id) + '/send', { method: 'POST' });
    if (r.sent) { mailFolder = 'sent'; alert('Sent.'); }
    else if (r.status === 'queued') { mailFolder = 'outbox'; alert('Queued. Set FINCH_EMAIL + FINCH_EMAIL_PASSWORD on Vercel to deliver for real.'); }
    else alert('Send issue: ' + (r.error || 'unknown'));
    renderEmails(null);
  }

  async function delMail(id) {
    if (!confirm('Delete this message?')) return;
    await fetch('/api/admin/emails/' + encodeURIComponent(id), { method: 'DELETE' });
    mailFolder = 'inbox';
    renderEmails(null);
  }

  async function connectChat() {
    var m = document.getElementById('chatMsgs');
    if (!m) return;
    m.innerHTML = '';
    try {
      var d = await api('/api/admin/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: 'phone', start: true })
      });
      if (d.content) {
        var div = document.createElement('div');
        div.className = 'msg finch';
        div.textContent = d.content;
        m.appendChild(div);
      }
      chatBootstrapped = true;
    } catch (e) {}
  }

  async function sendChat() {
    var i = document.getElementById('chatMsg');
    var t = i.value.trim();
    if (!t) return;
    var m = document.getElementById('chatMsgs');
    var you = document.createElement('div');
    you.className = 'msg you';
    you.textContent = t;
    m.appendChild(you);
    m.scrollTop = m.scrollHeight;
    i.value = '';
    var thinking = document.createElement('div');
    thinking.className = 'typing';
    thinking.textContent = 'Harold is thinking…';
    m.appendChild(thinking);
    m.scrollTop = m.scrollHeight;
    try {
      var d = await api('/api/admin/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: 'phone', content: t })
      });
      thinking.remove();
      var div = document.createElement('div');
      div.className = 'msg finch';
      div.textContent = d.content || '…';
      m.appendChild(div);
      m.scrollTop = m.scrollHeight;
    } catch (e) {
      thinking.remove();
      var err = document.createElement('div');
      err.className = 'msg finch';
      err.textContent = 'Connection hitch. Try again.';
      m.appendChild(err);
    }
  }

  renderTab('status');
</script>
</body>
</html>
