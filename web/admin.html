<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aegis">
<link rel="manifest" href="/manifest.json">
<title>Aegis — Command</title>
<style>
  :root {
    --bg: #07070b;
    --bg2: #0c0c12;
    --bg3: #12121a;
    --bg4: #181822;
    --line: #1f1f2c;
    --line2: #2a2a3a;
    --text: #f2f2f7;
    --muted: #8b8b9a;
    --dim: #5c5c6e;
    --green: #34d399;
    --green-dim: rgba(52,211,153,.12);
    --blue: #3b82f6;
    --blue-dim: rgba(59,130,246,.14);
    --amber: #fbbf24;
    --amber-dim: rgba(251,191,36,.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,.12);
    --radius: 16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --nav-h: 64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
    background:radial-gradient(1200px 500px at 50% -10%,rgba(52,211,153,.08),transparent 55%),var(--bg2);
    position:relative;
  }
  @media(min-width:900px){
    body{display:flex;align-items:center;justify-content:center;background:#030306}
    .shell{
      max-width:980px;height:min(920px,96vh);border-radius:24px;overflow:hidden;
      border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.55);
      flex-direction:row;
    }
    .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
    .side{
      width:280px;border-right:1px solid var(--line);background:rgba(0,0,0,.25);
      display:flex;flex-direction:column;padding:24px 16px;gap:8px;
    }
    .side .brand{padding:8px 12px 24px}
    .side .nav-btn{
      display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
      border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
      cursor:pointer;text-align:left;width:100%;
    }
    .side .nav-btn.active{background:var(--green-dim);color:var(--green)}
    .side .nav-btn .ic{font-size:18px;width:24px;text-align:center}
    .botnav{display:none!important}
    .content{padding-bottom:24px!important}
  }
  @media(max-width:899px){.side{display:none!important}}

  .top{
    padding:12px 18px;padding-top:max(12px,var(--safe-t));
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid transparent;backdrop-filter:blur(12px);
    background:linear-gradient(180deg,rgba(7,7,11,.92),rgba(7,7,11,.55));
    z-index:5;
  }
  .brand-row{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(145deg,#065f46,#34d399);
    display:grid;place-items:center;font-weight:800;color:#04120c;font-size:16px;
    box-shadow:0 0 24px rgba(52,211,153,.25);flex-shrink:0;
  }
  .brand-row h1{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .brand-row p{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill-status{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);color:var(--muted);
  }
  .pill-status.on{color:var(--green);background:var(--green-dim);border-color:rgba(52,211,153,.25)}
  .pill-status .d{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

  .content{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 16px 16px;
  }
  .content.chat-mode{padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}

  .greet{padding:8px 2px 18px}
  .greet .hi{font-size:26px;font-weight:720;letter-spacing:-.03em;line-height:1.15}
  .greet .sub{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.45}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{
    background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;position:relative;overflow:hidden;
  }
  .stat::after{
    content:"";position:absolute;inset:auto -20% -40% auto;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.04),transparent 70%);pointer-events:none;
  }
  .stat .k{font-size:11px;font-weight:650;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:24px;font-weight:720;letter-spacing:-.03em;margin-top:6px}
  .stat .h{font-size:11px;color:var(--muted);margin-top:4px}
  .v.g{color:var(--green)}.v.b{color:#60a5fa}.v.a{color:var(--amber)}.v.r{color:var(--red)}

  .card{
    background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .card.tap{cursor:pointer;transition:border-color .15s,transform .12s}
  .card.tap:active{transform:scale(.99)}
  .card.tap:hover{border-color:var(--line2)}
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;
  }
  .sec-head h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .sec-head a, .link-btn{
    border:none;background:none;color:var(--green);font-size:12px;font-weight:650;cursor:pointer;
  }

  .action{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .action:first-of-type{border-top:none;padding-top:2px}
  .action .dot{
    width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:15px;
    background:var(--bg4);border:1px solid var(--line);
  }
  .action .dot.mail{background:var(--amber-dim);border-color:rgba(251,191,36,.2)}
  .action .dot.live{background:var(--blue-dim);border-color:rgba(59,130,246,.25)}
  .action .dot.hand{background:var(--green-dim);border-color:rgba(52,211,153,.25)}
  .action .t{font-size:14px;font-weight:600;line-height:1.3}
  .action .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .action .go{margin-left:auto;color:var(--dim);font-size:18px;align-self:center}

  .empty{
    text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.55;
  }
  .empty .big{font-size:36px;margin-bottom:12px}
  .empty h4{color:var(--text);font-size:16px;margin-bottom:6px}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{
    appearance:none;border:none;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:650;
    cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:opacity .15s,transform .1s;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
  .btn.green{background:#059669}
  .btn.danger{background:#7f1d1d}
  .btn.amber{background:#b45309}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .chip{
    flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);
    background:var(--bg3);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;
  }
  .chip.on{background:var(--green-dim);color:var(--green);border-color:rgba(52,211,153,.35)}

  .mail-row{display:flex;gap:12px;align-items:flex-start}
  .av{
    width:40px;height:40px;border-radius:12px;background:var(--bg4);border:1px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green);flex-shrink:0;
  }
  .mail-row .from{font-size:14px;font-weight:650}
  .mail-row .subj{font-size:13px;color:#d4d4de;margin-top:2px}
  .mail-row .prev{font-size:12px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mail-row.unread .from,.mail-row.unread .subj{color:var(--green)}
  .tag{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:var(--bg4);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:6px;
  }
  .tag.unread{background:var(--red-dim);color:var(--red)}
  .tag.draft{background:var(--blue-dim);color:#60a5fa}
  .tag.queued{background:var(--amber-dim);color:var(--amber)}
  .tag.sent{background:var(--green-dim);color:var(--green)}
  .tag.ex{background:rgba(255,255,255,.06);color:var(--dim)}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}

  .field{width:100%;margin-bottom:8px}
  .field label{display:block;font-size:11px;font-weight:650;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  input,textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);
    background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
  textarea{min-height:140px;resize:vertical;line-height:1.5}

  /* Chat */
  .chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;height:100%}
  .chat-stream{
    flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .bubble{
    max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;
  }
  .bubble.you{
    align-self:flex-end;background:var(--blue);color:#fff;
    border-bottom-right-radius:5px;
  }
  .bubble.harold{
    align-self:flex-start;background:var(--bg3);border:1px solid var(--line);
    color:var(--text);border-bottom-left-radius:5px;
  }
  .bubble .who{font-size:10px;font-weight:700;color:var(--green);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
  .typing{
    align-self:flex-start;display:inline-flex;gap:5px;padding:12px 16px;background:var(--bg3);
    border:1px solid var(--line);border-radius:16px;
  }
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  .composer{
    display:flex;gap:8px;padding:10px 14px;padding-bottom:max(10px,var(--safe-b));
    border-top:1px solid var(--line);background:rgba(7,7,11,.92);backdrop-filter:blur(16px);
  }
  .composer input{
    flex:1;border-radius:22px;padding:12px 16px;background:var(--bg3);border:1px solid var(--line2);font-size:16px;
  }
  .composer button{
    width:46px;height:46px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    font-size:18px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;
  }
  .composer button:disabled{opacity:.4}
  .suggest{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px}
  .suggest button{
    flex-shrink:0;border:1px solid var(--line2);background:var(--bg3);color:var(--muted);
    border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }

  .botnav{
    position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
    padding-bottom:var(--safe-b);background:rgba(8,8,12,.94);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
    z-index:20;
  }
  .botnav button{
    border:none;background:none;color:var(--dim);font-size:10px;font-weight:650;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  }
  .botnav button .ic{display:flex;align-items:center;justify-content:center;height:24px;line-height:1}.botnav button .ic svg{display:block}
  .botnav button.on{color:var(--green)}
  .botnav .nb{
    position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;
    background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;
    display:none;align-items:center;justify-content:center;
  }

  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translateX(-50%) translateY(20px);
    background:#1a1a24;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;
    max-width:90%;box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .person{display:flex;gap:12px;align-items:center;padding:4px 0}
  .person .name{font-size:14px;font-weight:650}
  .person .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .price{margin-left:auto;font-weight:700;color:var(--green);font-size:14px}

  .skeleton{height:84px;border-radius:var(--radius);background:linear-gradient(90deg,var(--bg3),var(--bg4),var(--bg3));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .note{
    font-size:12px;color:var(--muted);line-height:1.45;padding:10px 12px;border-radius:12px;
    background:rgba(255,255,255,.03);border:1px dashed var(--line2);margin-bottom:12px;
  }

  .main{
    flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;
    /* keep composer above bottom nav */
    padding-bottom: calc(var(--nav-h) + var(--safe-b));
  }
  #chatBar.composer{
    flex-shrink:0;
    z-index:30;
    position:relative;
    background:rgba(7,7,11,.98);
    border-top:1px solid var(--line);
    padding:10px 14px;
    padding-bottom:12px;
    gap:8px;
    display:none; /* toggled in JS */
  }
  #chatBar.composer.is-open{display:flex !important;}
  #chatBar.composer input{
    flex:1;border-radius:22px;padding:13px 16px;background:var(--bg3);
    border:1px solid var(--line2);color:var(--text);font-size:16px;outline:none;font-family:inherit;
  }
  #chatBar.composer input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
  #chatBar.composer button{
    width:48px;height:48px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    font-size:18px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;padding:0;
  }
  #chatBar.composer button.ghost{
    background:var(--bg3);color:var(--muted);border:1px solid var(--line2);font-size:16px;
  }
  #chatBar.composer button.ghost.on{
    background:rgba(52,211,153,.15);color:var(--green);border-color:rgba(52,211,153,.4);
  }
  #chatBar.composer button.ghost.listening{
    background:rgba(239,68,68,.18);color:#f87171;border-color:rgba(239,68,68,.45);
    animation:pulseMic 1.1s ease-in-out infinite;
  }
  @keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  #chatBar.composer button svg{width:20px;height:20px;display:block}
  .content{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 16px 16px;
  }
  .content.chat-mode{
    padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;height:100%}
  .chat-stream{
    flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .suggest{
    display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;flex-shrink:0;
  }

  @media(min-width:900px){
    .main{padding-bottom:0 !important}
  }
  .login-gate{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
    background:radial-gradient(700px 420px at 50% 20%,rgba(52,211,153,.11),transparent 65%),#07070b;
  }
  .login-gate[hidden]{display:none}
  .login-card{
    width:min(100%,390px);padding:28px;border:1px solid var(--line2);border-radius:22px;
    background:rgba(18,18,26,.96);box-shadow:0 30px 90px rgba(0,0,0,.5)
  }
  .login-card h1{font-size:25px;letter-spacing:-.03em;margin-top:18px}
  .login-card p{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 22px}
  .login-card label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .login-card input{
    width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;
    background:var(--bg);color:var(--text);font:inherit;outline:none
  }
  .login-card input:focus{border-color:var(--green)}
  .login-card button{
    width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;
    background:var(--green);color:#032116;font:inherit;font-weight:750;cursor:pointer
  }
  .login-error{min-height:20px;margin-top:12px;color:var(--red);font-size:12px}

</style>
</head>
<body>
<div class="login-gate" id="loginGate">
  <form class="login-card" id="loginForm">
    <div class="logo">A</div>
    <h1>Owner access</h1>
    <p>Sign in to Aegis Command. Your session expires automatically after eight hours.</p>
    <label for="ownerPassword">Password</label>
    <input id="ownerPassword" name="password" type="password" autocomplete="current-password" required>
    <button id="loginButton" type="submit">Sign in securely</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </form>
</div>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-row">
        <div class="logo">A</div>
        <div>
          <h1>Aegis</h1>
          <p>Command</p>
        </div>
      </div>
    </div>
    <button class="nav-btn active" data-tab="home" type="button"><span class="ic">⌂</span> Home</button>
    <button class="nav-btn" data-tab="mail" type="button"><span class="ic">✉</span> Mail</button>
    <button class="nav-btn" data-tab="leads" type="button"><span class="ic">◎</span> Leads</button>
    <button class="nav-btn" data-tab="chat" type="button"><span class="ic">✦</span> Harold</button>
    <button class="nav-btn" data-tab="more" type="button"><span class="ic">☰</span> Business</button>
    <div style="flex:1"></div>
    <div class="note" id="sideNote" style="margin:8px">Loading…</div>
  </aside>

  <div class="main" id="mainCol">
    <header class="top">
      <div class="brand-row">
        <div class="logo">A</div>
        <div>
          <h1 id="topTitle">Aegis</h1>
          <p id="topSub">Attack surface command</p>
        </div>
      </div>
      <div class="pill-status" id="brainPill"><span class="d"></span><span>…</span></div>
    </header>

    <div id="content" class="content">
      <div class="skeleton"></div>
      <div class="skeleton" style="margin-top:10px;height:160px"></div>
    </div>

    <div id="chatBar" class="composer" style="display:none" aria-hidden="true">
      <button type="button" id="chatSpeak" class="ghost on" title="Harold speaks replies" aria-label="Toggle Harold voice" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a4.5 4.5 0 0 1 0 7"/><path d="M18.5 5.5a8.5 8.5 0 0 1 0 13"/></svg>
      </button>
      <button type="button" id="chatMic" class="ghost" title="Hold or tap to talk" aria-label="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      </button>
      <input id="chatMsg" type="text" placeholder="Message Harold… or hold mic" autocomplete="off" enterkeyhint="send" aria-label="Message Harold">
      <button type="button" id="chatSend" aria-label="Send">↑</button>
    </div>
  </div>

  <nav class="botnav" id="botnav">
    <button type="button" data-tab="home" class="on"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5z"/></svg></span>Home</button>
    <button type="button" data-tab="mail" style="position:relative">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg></span>Mail
      <span class="nb" id="mailBadge">0</span>
    </button>
    <button type="button" data-tab="leads"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>Leads</button>
    <button type="button" data-tab="chat"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg></span>Harold</button>
    <button type="button" data-tab="more"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>More</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const state = {
    tab: 'home',
    mailFolder: 'inbox',
    dash: null,
    chatReady: false,
    csrfToken: '',
    adminId: localStorage.getItem('finch_admin_id') || ('a-' + Math.random().toString(36).slice(2, 10)),
  };
  localStorage.setItem('finch_admin_id', state.adminId);

  const $ = (id) => document.getElementById(id);
  const content = $('content');
  const chatBar = $('chatBar');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function setBrain(online) {
    const p = $('brainPill');
    p.className = 'pill-status' + (online ? ' on' : '');
    p.innerHTML = '<span class="d"></span><span>' + (online ? 'Harold online' : 'Assistant offline') + '</span>';
  }

  function setBadge(n) {
    const b = $('mailBadge');
    if (!b) return;
    if (n > 0) { b.style.display = 'flex'; b.textContent = n > 9 ? '9+' : String(n); }
    else b.style.display = 'none';
  }

  function greetLine() {
    const h = new Date().getHours();
    if (h < 5) return 'Late night.';
    if (h < 12) return 'Good morning.';
    if (h < 17) return 'Good afternoon.';
    if (h < 21) return 'Good evening.';
    return 'Working late.';
  }

  async function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {});
    if (state.csrfToken && !['GET', 'HEAD'].includes((opts.method || 'GET').toUpperCase())) {
      opts.headers['X-CSRF-Token'] = state.csrfToken;
    }
    const r = await fetch(url, opts);
    if (r.status === 401) {
      $('loginGate').hidden = false;
      throw new Error('authentication_required');
    }
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || ('http ' + r.status));
    }
    return r.json();
  }

  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.botnav button, .side .nav-btn').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-tab') === tab);
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    const titles = {
      home: ['Home', 'What needs you'],
      mail: ['Mail', 'Inbox · drafts · outbox'],
      leads: ['Leads', 'Find companies · emails · outreach'],
      chat: ['Harold', 'Private owner assistant'],
      more: ['Business', 'Handoffs · clients · docs'],
    };
    $('topTitle').textContent = titles[tab][0];
    $('topSub').textContent = titles[tab][1];
    const chatMode = tab === 'chat';
    content.classList.toggle('chat-mode', chatMode);
    chatBar.classList.toggle('is-open', chatMode);
    chatBar.style.display = chatMode ? 'flex' : 'none';
    chatBar.setAttribute('aria-hidden', chatMode ? 'false' : 'true');
    if (chatMode) setTimeout(function(){ try{$('chatMsg').focus();}catch(e){} }, 80);
    render();
  }

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
  });

  async function loadDash() {
    state.dash = await api('/api/admin/dashboard');
    setBrain(!!state.dash.brain_online);
    setBadge((state.dash.mail || {}).unread || 0);
    const sn = $('sideNote');
    if (sn) {
      const m = state.dash.mail || {};
      sn.textContent = (state.dash.brain_online ? 'Brain online · ' : 'Brain offline · ') +
        (m.unread || 0) + ' unread · £' + Number(state.dash.annual_revenue || 0).toLocaleString() + ' annual revenue';
    }
    return state.dash;
  }

  async function render() {
    try {
      if (state.tab === 'home') await renderHome();
      else if (state.tab === 'mail') await renderMail(null);
      else if (state.tab === 'leads') await renderLeads(null);
      else if (state.tab === 'chat') await renderChat();
      else await renderMore();
    } catch (e) {
      console.error(e);
      content.innerHTML = '<div class="empty"><div class="big">⚠</div><h4>Could not load</h4>Check your connection and try again.</div>';
    }
  }

  function isExample(m) {
    return String(m.id || '').startsWith('seed-') || m.example === true;
  }

  async function renderHome() {
    content.innerHTML = '<div class="skeleton"></div><div class="skeleton" style="margin-top:10px;height:200px"></div>';
    const d = await loadDash();
    const mail = d.mail || {};
    const handoffs = d.pending_handoffs || [];
    const recent = d.recent_mail || [];
    const unread = recent.filter(m => m.status === 'unread');
    const clients = d.clients || [];
    const realClients = clients;
    const annualRevenue = Number(d.annual_revenue || 0);
    const paypal = d.paypal || {};

    let actions = '';
    unread.slice(0, 3).forEach(m => {
      actions += '<div class="action tap" data-go="mail" data-open="' + esc(m.id) + '">' +
        '<div class="dot mail">✉</div><div><div class="t">' + esc(m.from) + '</div>' +
        '<div class="s">' + esc(m.subject) + '</div></div><div class="go">›</div></div>';
    });
    handoffs.slice(0, 3).forEach(h => {
      actions += '<div class="action tap" data-go="more">' +
        '<div class="dot hand">✓</div><div><div class="t">Handoff · ' + esc(h.company || 'Prospect') + '</div>' +
        '<div class="s">' + esc(h.email) + ' · $' + Number(h.price || 0).toLocaleString() + '/mo ready</div></div><div class="go">›</div></div>';
    });
    if ((d.active_conversations || 0) > 0) {
      actions += '<div class="action"><div class="dot live">●</div><div><div class="t">' +
        d.active_conversations + ' live prospect chat' + (d.active_conversations > 1 ? 's' : '') +
        '</div><div class="s">Harold is assisting a visitor on the public page.</div></div></div>';
    }
    if (!actions) {
      actions = '<div class="empty" style="padding:20px 8px">' +
        '<h4 style="font-size:15px;margin-bottom:6px">Clear board</h4>' +
        'No urgent handoffs. Open Mail to work outreach, or talk to Harold.</div>';
    }

    const nextSteps =
      '<div class="card" style="margin-top:4px">' +
      '<div class="sec-head"><h3>Work with Harold</h3></div>' +
      '<div class="row">' +
      '<button type="button" class="btn sm" data-go="chat">Talk to Harold</button>' +
      '<button type="button" class="btn ghost sm" data-go="mail">Compose outreach</button>' +
      '<a class="btn ghost sm" href="/" target="_blank" rel="noopener">Open public chat</a>' +
      '</div></div>';

    const paypalCard =
      '<div class="card" style="margin-top:4px">' +
      '<div class="sec-head"><h3>PayPal checkout</h3><span class="tag ' +
      (paypal.configured ? 'sent' : 'queued') + '">' +
      (paypal.configured ? 'Configured' : 'Setup required') + '</span></div>' +
      '<div class="note">' +
      (paypal.configured
        ? 'PayPal ' + esc(paypal.environment || 'sandbox') + ' credentials are connected. Customer checkout is fixed at £' + Number(paypal.annual_price_gbp || 995) + ' for 12 months.'
        : 'Add PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET and PAYPAL_ENVIRONMENT as protected Vercel variables. For security, Aegis never stores or displays the PayPal secret.') +
      '</div><div class="row" style="margin-top:10px">' +
      '<a class="btn sm" href="https://developer.paypal.com/dashboard/applications/sandbox" target="_blank" rel="noopener">Open PayPal setup</a>' +
      '<a class="btn ghost sm" href="https://vercel.com/patriotradars-projects/finch-ocxl/settings/environment-variables" target="_blank" rel="noopener">Add secure variables</a>' +
      '</div></div>';

    content.innerHTML =
      '<div class="greet"><div class="hi">' + greetLine() + '</div>' +
      '<div class="sub">Harold is ' + (d.brain_online ? 'online and working with you.' : 'offline — replies may be limited.') +
      ' Here is what needs attention.</div></div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="k">Unread mail</div><div class="v ' + ((mail.unread||0)?'a':'g') + '">' + (mail.unread||0) + '</div><div class="h">' + (mail.inbox||0) + ' in inbox</div></div>' +
      '<div class="stat"><div class="k">Live chats</div><div class="v b">' + (d.active_conversations||0) + '</div><div class="h">Public site</div></div>' +
      '<div class="stat"><div class="k">Handoffs</div><div class="v a">' + handoffs.length + '</div><div class="h">Ready for you</div></div>' +
      '<div class="stat"><div class="k">Annual revenue</div><div class="v g">£' + annualRevenue.toLocaleString() + '</div><div class="h">' + realClients.length + ' paying client' + (realClients.length===1?'':'s') + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="sec-head"><h3>Needs you</h3><button type="button" class="link-btn" data-go="mail">All mail</button></div>' +
      actions + '</div>' +
      paypalCard +
      nextSteps;

    content.querySelectorAll('[data-go]').forEach(el => {
      el.addEventListener('click', () => {
        const tab = el.getAttribute('data-go');
        const open = el.getAttribute('data-open');
        if (tab === 'mail') {
          state.mailFolder = 'inbox';
          switchTab('mail');
          if (open) setTimeout(() => renderMail(open), 0);
        } else switchTab(tab);
      });
    });
  }

  async function renderMail(openId) {
    content.innerHTML = '<div class="skeleton"></div>';
    const d = await api('/api/admin/emails' + (state.mailFolder === 'all' ? '' : ('?folder=' + encodeURIComponent(state.mailFolder))));
    await loadDash().catch(() => {});
    const cfg = d.config || {};
    const s = d.summary || {};
    setBadge(s.unread || 0);

    if (openId) {
      const full = await api('/api/admin/emails/' + encodeURIComponent(openId));
      const m = full.message;
      if (!m) { state.mailFolder = 'inbox'; return renderMail(null); }
      let actions = '<button type="button" class="btn ghost sm" id="mailBack">← Back</button>';
      if (m.folder === 'drafts' || m.folder === 'outbox') {
        actions += '<button type="button" class="btn green sm" id="mailSend">Send / Queue</button>';
      }
      if (m.folder === 'inbox') {
        actions += '<button type="button" class="btn sm" id="mailReply">Reply with Harold</button>';
      }
      actions += '<button type="button" class="btn danger sm" id="mailDel">Delete</button>';
      content.innerHTML =
        '<div class="row" style="margin-bottom:12px">' + actions + '</div>' +
        (isExample(m) ? '<div class="note">Example thread · safe to delete. Real mail appears here when SMTP is connected.</div>' : '') +
        '<div class="card">' +
        '<div style="font-size:12px;color:var(--muted)">' + esc(m.from) + ' → ' + esc(m.to) + '</div>' +
        '<div style="font-size:18px;font-weight:700;margin:8px 0;letter-spacing:-.02em">' + esc(m.subject) + '</div>' +
        '<span class="tag ' + esc(m.status || m.folder) + '">' + esc(m.status || m.folder) + '</span>' +
        (m.company ? '<span class="tag">' + esc(m.company) + '</span>' : '') +
        '<div style="white-space:pre-wrap;font-size:15px;line-height:1.55;margin-top:16px;color:#e4e4ec">' + esc(m.body) + '</div>' +
        '<div class="meta">' + esc(m.created_at || '') + '</div></div>';
      $('mailBack').onclick = () => renderMail(null);
      const sd = $('mailSend'); if (sd) sd.onclick = () => sendMail(m.id);
      const dl = $('mailDel'); if (dl) dl.onclick = () => delMail(m.id);
      const rp = $('mailReply'); if (rp) rp.onclick = () => {
        switchTab('chat');
        setTimeout(() => {
          const i = $('chatMsg');
          if (i) {
            i.value = 'Help me reply to this email from ' + m.from + ' about "' + m.subject + '":\n\n' + m.body;
            i.focus();
          }
        }, 100);
      };
      return;
    }

    const folders = [
      ['inbox', 'Inbox' + (s.unread ? ' · ' + s.unread : '')],
      ['drafts', 'Drafts'],
      ['outbox', 'Outbox'],
      ['sent', 'Sent'],
      ['all', 'All'],
    ];
    let html = '';
    if (!cfg.configured) {
      html += '<div class="card"><div class="sec-head"><h3>Email configuration</h3></div>' +
        '<div class="note">For security, Aegis never stores email passwords in the dashboard. ' +
        'Configure <b style="color:var(--text)">FINCH_EMAIL</b> and ' +
        '<b style="color:var(--text)">FINCH_EMAIL_PASSWORD</b> as protected deployment variables. ' +
        'Existing FINCH_* names remain supported.</div></div>';
    } else {
      html += '<div class="note" style="border-style:solid;border-color:rgba(52,211,153,.25);color:var(--green)">' +
        'SMTP connected · ' + esc(cfg.from_address || '') +
        ' <button type="button" class="link-btn" id="btnSmtpTest" style="margin-left:8px">Send test</button>' +
        ' <button type="button" class="link-btn" id="btnSmtpClear" style="margin-left:6px;color:var(--muted)">Disconnect</button></div>';
    }
    html += '<div class="chips">';
    folders.forEach(([f, label]) => {
      html += '<button type="button" class="chip' + (state.mailFolder === f ? ' on' : '') + '" data-folder="' + f + '">' + esc(label) + '</button>';
    });
    html += '</div>';

    html += '<div class="card">' +
      '<div class="sec-head"><h3>New outreach</h3></div>' +
      '<div class="field"><label>Company</label><input id="cCompany" placeholder="Acme Corp" autocomplete="organization"></div>' +
      '<div class="field"><label>To</label><input id="cTo" placeholder="cto@acme.com" inputmode="email" autocomplete="email"></div>' +
      '<div class="field"><label>Verified public observation (optional)</label><input id="cFinding" placeholder="Use factual evidence only"></div>' +
      '<div class="row" style="margin-top:4px">' +
      '<button type="button" class="btn sm" id="btnCraft">Draft with Harold</button>' +
      '<button type="button" class="btn ghost sm" id="btnManual">Write manually</button></div>' +
      '<div id="manualBox" style="display:none;margin-top:12px">' +
      '<div class="field"><label>Subject</label><input id="cSubj" placeholder="Subject"></div>' +
      '<div class="field"><label>Body</label><textarea id="cBody" placeholder="Write the email…"></textarea></div>' +
      '<button type="button" class="btn green sm" id="btnSaveDraft">Save draft</button></div></div>';

    const msgs = d.messages || [];
    if (!msgs.length) {
      html += '<div class="empty"><div class="big">✉</div><h4>No messages here</h4>Draft outreach above — Harold will help write it.</div>';
    } else {
      msgs.forEach(m => {
        const unread = m.status === 'unread' ? ' unread' : '';
        const who = m.folder === 'inbox' ? m.from : m.to;
        const initials = String(who || '?').replace(/[^a-zA-Z0-9]/g, ' ').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase() || '?';
        html += '<div class="card tap mail-item' + unread + '" data-open="' + esc(m.id) + '"><div class="mail-row' + unread + '">' +
          '<div class="av">' + esc(initials.slice(0, 2)) + '</div><div style="min-width:0;flex:1">' +
          '<div class="from">' + esc(who) +
          '<span class="tag ' + esc(m.status || m.folder) + '">' + esc(m.status || m.folder) + '</span>' +
          (isExample(m) ? '<span class="tag ex">example</span>' : '') +
          '</div><div class="subj">' + esc(m.subject) + '</div>' +
          '<div class="prev">' + esc(String(m.body || '').replace(/\s+/g, ' ').slice(0, 110)) + '</div>' +
          '<div class="meta">' + esc((m.company || '') + (m.created_at ? ' · ' + String(m.created_at).replace('T', ' ').slice(0, 16) : '')) + '</div>' +
          '</div></div></div>';
      });
    }
    content.innerHTML = html;

    const bt = $('btnSmtpTest');
    if (bt) bt.onclick = async () => {
      toast('Sending test…');
      try {
        const r = await api('/api/admin/mail/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        if (r.sent) toast('Test emailed to ' + (r.message && r.message.to));
        else if (r.status === 'queued') toast('Queued — SMTP not active on this instance');
        else toast((r.error || 'Test failed').slice(0, 80));
        renderMail(null);
      } catch (e) { toast('Test failed'); }
    };
    const smtpClearButton = $('btnSmtpClear');
    if (smtpClearButton) smtpClearButton.onclick = async () => {
      await api('/api/admin/mail/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'clear' }) });
      toast('Disconnected'); renderMail(null);
    };

    content.querySelectorAll('[data-folder]').forEach(btn => {
      btn.onclick = () => { state.mailFolder = btn.getAttribute('data-folder'); renderMail(null); };
    });
    content.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => renderMail(el.getAttribute('data-open'));
    });
    const craftButton = $('btnCraft');
    if (craftButton) craftButton.onclick = craftMail;
    const bm = $('btnManual');
    if (bm) bm.onclick = () => {
      const box = $('manualBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    };
    const bs = $('btnSaveDraft');
    if (bs) bs.onclick = saveManualDraft;
  }

  async function craftMail() {
    const company = ($('cCompany').value || '').trim();
    const to = ($('cTo').value || '').trim();
    const finding = ($('cFinding').value || '').trim();
    if (!to) { toast('Add a recipient email'); return; }
    const btn = $('btnCraft');
    btn.disabled = true; btn.textContent = 'Drafting…';
    try {
      await api('/api/admin/emails', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'craft', company, to, finding })
      });
      toast('Draft ready');
      state.mailFolder = 'drafts';
      renderMail(null);
    } catch (e) {
      toast('Could not draft');
      btn.disabled = false; btn.textContent = 'Draft with Harold';
    }
  }

  async function saveManualDraft() {
    const to = ($('cTo').value || '').trim();
    const subject = ($('cSubj').value || '').trim();
    const body = ($('cBody').value || '');
    const company = ($('cCompany').value || '').trim();
    if (!to) { toast('Add a recipient email'); return; }
    await api('/api/admin/emails', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'draft', to, subject, body, company })
    });
    toast('Draft saved');
    state.mailFolder = 'drafts';
    renderMail(null);
  }

  async function sendMail(id) {
    try {
      const r = await api('/api/admin/emails/' + encodeURIComponent(id) + '/send', { method: 'POST' });
      if (r.sent) { toast('Sent'); state.mailFolder = 'sent'; }
      else if (r.status === 'queued') { toast('Queued in outbox'); state.mailFolder = 'outbox'; }
      else toast(r.error || 'Send failed');
      renderMail(null);
    } catch (e) { toast('Send failed'); }
  }

  async function delMail(id) {
    if (!confirm('Delete this message?')) return;
    await fetch('/api/admin/emails/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('Deleted');
    renderMail(null);
  }


  // ---------- Leads pipeline ----------
  function sevColor(sev) {
    return sev === 'high' ? 'var(--red)' : sev === 'medium' ? 'var(--amber, #f5a623)' : sev === 'low' ? 'var(--b, #6ea8fe)' : 'var(--dim)';
  }

  async function renderLeads(openId) {
    content.innerHTML = '<div class="skeleton"></div>';
    const d = await api('/api/admin/leads');
    const sum = d.summary || {};
    const leads = d.leads || [];

    if (openId) {
      const full = await api('/api/admin/leads/' + encodeURIComponent(openId));
      const l = full.lead;
      if (!l) return renderLeads(null);
      let html = '<div class="row" style="margin-bottom:12px">' +
        '<button type="button" class="btn ghost sm" id="leadBack">\u2190 Back</button>' +
        '<button type="button" class="btn danger sm" id="leadDel">Delete</button></div>';

      html += '<div class="card">' +
        '<div style="font-size:18px;font-weight:700;letter-spacing:-.02em">' + esc(l.company || l.domain) + '</div>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(l.domain) + '</div>' +
        '<div style="margin-top:8px"><span class="tag ' + esc(l.stage) + '">' + esc(l.stage) + '</span></div></div>';

      html += '<div class="card"><div class="sec-head"><h3>Contact emails</h3></div>';
      const emails = l.emails || [];
      if (!emails.length) {
        html += '<div class="note">No sourced business email has been recorded. Aegis never guesses addresses.</div>';
      }
      emails.forEach(e => {
        const sel = (l.selected_email === e.email);
        html += '<div class="person" style="padding:10px 0;border-top:1px solid var(--line);align-items:center">' +
          '<div style="min-width:0;flex:1"><div class="name" style="word-break:break-all">' + esc(e.email) +
          (sel ? ' <span class="tag ready">selected</span>' : '') + '</div>' +
          '<div class="sub">' + esc(e.source || '') + (e.position ? ' \u00b7 ' + esc(e.position) : '') + (e.name ? ' \u00b7 ' + esc(e.name) : '') + '</div></div>' +
          '<button type="button" class="btn ' + (sel ? 'ghost' : '') + ' sm" data-sel="' + esc(e.email) + '">' + (sel ? 'Picked' : 'Pick') + '</button></div>';
      });
      html += '</div>';

      const signals = l.signals || [];
      html += '<div class="card"><div class="sec-head"><h3>Public security-interest signal</h3></div>' +
        signals.map(s => '<div style="padding:9px 0"><div class="name">' + esc(s.title) + '</div><div class="sub">' + esc(s.excerpt) + '</div><a href="' + esc(s.source_url) + '" target="_blank" rel="noopener">Open source</a></div>').join('') + '</div>';

      html += '<div class="card"><div class="sec-head"><h3>Outreach</h3></div>' +
        '<div style="font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px">Harold will refer only to the sourced public company update—never an invented vulnerability—and write to <b style="color:var(--text)">' + esc(l.selected_email || 'no email picked yet') + '</b>.</div>' +
        '<div class="row">' +
        '<button type="button" class="btn sm" id="leadDraft"' + (l.selected_email ? '' : ' disabled') + '>Draft with Harold</button>' +
        '<button type="button" class="btn green sm" id="leadSend"' + (l.selected_email ? '' : ' disabled') + '>Draft + Send</button></div></div>';

      content.innerHTML = html;
      $('leadBack').onclick = () => renderLeads(null);
      $('leadDel').onclick = async () => {
        if (!confirm('Delete this lead?')) return;
        await fetch('/api/admin/leads/' + encodeURIComponent(openId), { method: 'DELETE' });
        toast('Lead deleted'); renderLeads(null);
      };
      content.querySelectorAll('[data-sel]').forEach(btn => {
        btn.onclick = async () => {
          await api('/api/admin/leads/' + encodeURIComponent(openId) + '/select', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: btn.getAttribute('data-sel') }) });
          toast('Recipient picked'); renderLeads(openId);
        };
      });
      const ld = $('leadDraft');
      if (ld) ld.onclick = async () => {
        ld.disabled = true; ld.textContent = 'Drafting\u2026';
        try {
          const r = await api('/api/admin/leads/' + encodeURIComponent(openId) + '/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          if (r.ok) { toast('Draft ready in Mail \u00b7 Drafts'); state.mailFolder = 'drafts'; switchTab('mail'); }
          else { toast(r.error || 'Draft failed'); ld.disabled = false; ld.textContent = 'Draft with Harold'; }
        } catch (e) { toast('Draft failed'); ld.disabled = false; ld.textContent = 'Draft with Harold'; }
      };
      const ls = $('leadSend');
      if (ls) ls.onclick = async () => {
        ls.disabled = true; ls.textContent = 'Sending\u2026';
        try {
          const r = await api('/api/admin/leads/' + encodeURIComponent(openId) + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          if (r.sent) { toast('Sent'); renderLeads(openId); }
          else if (r.status === 'queued') { toast('Queued \u2014 connect SMTP to deliver'); renderLeads(openId); }
          else { toast(r.error || 'Send failed'); ls.disabled = false; ls.textContent = 'Draft + Send'; }
        } catch (e) { toast('Send failed'); ls.disabled = false; ls.textContent = 'Draft + Send'; }
      };
      return;
    }

    // List view
    let html = '<div class="card"><div class="sec-head"><h3>Record a sourced lead</h3></div>' +
      '<div class="field"><label>Company domain</label><input id="lDomain" placeholder="acme.com" inputmode="url" autocapitalize="off" autocomplete="off"></div>' +
      '<div class="field"><label>Company name</label><input id="lCompany" placeholder="Acme Ltd" autocomplete="organization"></div>' +
      '<div class="field"><label>Company type</label><select id="lType"><option value="limited_company">Limited company</option><option value="plc">PLC</option><option value="corporate_body">Corporate body</option></select></div>' +
      '<div class="field"><label>Public source URL</label><input id="lSourceUrl" placeholder="https://acme.com/news/security-update" inputmode="url"></div>' +
      '<div class="field"><label>Public update title</label><input id="lSignalTitle" placeholder="Acme renews Cyber Essentials"></div>' +
      '<div class="field"><label>Relevant excerpt</label><textarea id="lSignalExcerpt" placeholder="Copy a short factual excerpt showing the organisation is discussing cyber or information security."></textarea></div>' +
      '<div class="field"><label>Sourced business email (optional)</label><input id="lEmail" type="email" placeholder="security@acme.com"></div>' +
      '<div class="field"><label>Email source URL (required if email supplied)</label><input id="lEmailSource" placeholder="https://acme.com/contact" inputmode="url"></div>' +
      '<button type="button" class="btn sm" id="btnResearch" style="margin-top:4px">Record sourced lead</button></div>';

    html += '<div class="stats" style="margin:0 0 14px">' +
      '<div class="stat"><div class="k">Leads</div><div class="v b">' + (sum.total||0) + '</div><div class="h">researched</div></div>' +
      '<div class="stat"><div class="k">With emails</div><div class="v g">' + (sum.with_emails||0) + '</div><div class="h">ready to contact</div></div></div>';

    if (!leads.length) {
      html += '<div class="empty"><div class="big">\u25ce</div><h4>No leads yet</h4>Record a UK corporate prospect with a genuine public security-interest source.</div>';
    } else {
      leads.forEach(l => {
        const n = (l.emails || []).length;
        html += '<div class="card tap" data-lead="' + esc(l.id) + '"><div class="person" style="align-items:center">' +
          '<div class="av">' + esc(String(l.company || l.domain || '?')[0] || '?') + '</div>' +
          '<div style="min-width:0;flex:1"><div class="name">' + esc(l.company || l.domain) + '</div>' +
          '<div class="sub">' + esc(l.domain) + ' \u00b7 ' + n + ' email' + (n === 1 ? '' : 's') + '</div></div>' +
          '<span class="tag ' + esc(l.stage) + '">' + esc(l.stage) + '</span></div></div>';
      });
    }
    content.innerHTML = html;

    content.querySelectorAll('[data-lead]').forEach(el => {
      el.onclick = () => renderLeads(el.getAttribute('data-lead'));
    });
    $('btnResearch').onclick = async () => {
      const domain = ($('lDomain').value || '').trim();
      const company = ($('lCompany').value || '').trim();
      const source_url = ($('lSourceUrl').value || '').trim();
      const signal_title = ($('lSignalTitle').value || '').trim();
      const signal_excerpt = ($('lSignalExcerpt').value || '').trim();
      const contact_email = ($('lEmail').value || '').trim();
      const contact_source = ($('lEmailSource').value || '').trim();
      if (!domain || !company || !source_url || !signal_title || !signal_excerpt) { toast('Complete the company and public-source fields'); return; }
      const btn = $('btnResearch');
      btn.disabled = true; btn.textContent = 'Recording\u2026';
      try {
        const r = await api('/api/admin/leads/research', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ domain, company_name: company, business_type: $('lType').value, source_url, signal_title, signal_excerpt, contact_email, contact_source }) });
        if (r.ok && r.lead) { toast('Lead ready'); renderLeads(r.lead.id); }
        else { toast(r.error || 'Lead rejected'); btn.disabled = false; btn.textContent = 'Record sourced lead'; }
      } catch (e) {
        toast('Lead rejected'); btn.disabled = false; btn.textContent = 'Record sourced lead';
      }
    };
  }
  // ---------- /Leads pipeline ----------

  async function renderChat() {
    content.innerHTML =
      '<div class="chat-wrap">' +
      '<div class="chat-stream" id="chatMsgs"></div>' +
      '<div class="suggest" id="suggest">' +
      '<button type="button" data-q="What should we focus on today?">Focus today</button>' +
      '<button type="button" data-q="Who should we email next?">Next email</button>' +
      '<button type="button" data-q="Help me think through pricing.">Pricing</button>' +
      '<button type="button" data-q="Be honest — how are we doing?">How are we doing?</button>' +
      '</div></div>';
    const stream = $('chatMsgs');
    $('suggest').querySelectorAll('button').forEach(b => {
      b.onclick = () => { $('chatMsg').value = b.getAttribute('data-q'); sendChat(); };
    });

    if (!state.chatReady) {
      try {
        const d = await api('/api/admin/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_id: state.adminId, start: true })
        });
        if (d.content) appendBubble('harold', d.content);
        state.chatReady = true;
      } catch (e) {
        appendBubble('harold', "I'm having trouble reaching the line. Try again in a moment.");
      }
    } else {
      appendBubble('harold', "Still here.", { speak: false });
    }
    stream.scrollTop = stream.scrollHeight;
  }

  // ---------- Voice (Web Speech API) ----------
  const voice = {
    speakOn: localStorage.getItem('aegis_speak') !== '0',
    listening: false,
    rec: null,
    finalText: '',
  };
  function voiceSupported() {
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }
  function ttsSupported() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  }
  function stopSpeaking() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  }
  function speakHarold(text) {
    if (!voice.speakOn || !ttsSupported() || !text) return;
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
    u.rate = 1.02; u.pitch = 0.95; u.lang = 'en-US';
    const pick = () => {
      const voices = speechSynthesis.getVoices() || [];
      const pref = voices.find(v => /en(-|_)?US/i.test(v.lang) && /male|Daniel|Alex|Fred|Google US English/i.test(v.name))
        || voices.find(v => /en(-|_)US/i.test(v.lang))
        || voices.find(v => /^en/i.test(v.lang));
      if (pref) u.voice = pref;
      speechSynthesis.speak(u);
    };
    if ((speechSynthesis.getVoices() || []).length) pick();
    else speechSynthesis.onvoiceschanged = pick;
  }
  function setMicUI(on) {
    const b = $('chatMic');
    if (!b) return;
    b.classList.toggle('listening', !!on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function setSpeakUI() {
    const b = $('chatSpeak');
    if (!b) return;
    b.classList.toggle('on', voice.speakOn);
    b.setAttribute('aria-pressed', voice.speakOn ? 'true' : 'false');
    b.title = voice.speakOn ? 'Harold speaks replies (on)' : 'Harold speaks replies (off)';
  }
  function getRecognizer() {
    if (voice.rec) return voice.rec;
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) return null;
    const r = new Ctor();
    r.continuous = false;
    r.interimResults = true;
    r.lang = 'en-US';
    r.maxAlternatives = 1;
    r.onstart = () => { voice.listening = true; setMicUI(true); };
    r.onerror = (ev) => {
      voice.listening = false; setMicUI(false);
      const err = (ev && ev.error) || '';
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        toast('Mic blocked — allow microphone for this site');
      } else if (err === 'no-speech') {
        toast('No speech heard — try again');
      } else if (err && err !== 'aborted') {
        toast('Voice error: ' + err);
      }
    };
    r.onend = () => {
      voice.listening = false; setMicUI(false);
      const t = (voice.finalText || '').trim();
      voice.finalText = '';
      if (t) {
        const i = $('chatMsg');
        if (i) i.value = t;
        // auto-send after a successful utterance
        sendChat();
      }
    };
    r.onresult = (ev) => {
      let interim = '', final = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) final += res[0].transcript;
        else interim += res[0].transcript;
      }
      if (final) voice.finalText += final;
      const i = $('chatMsg');
      if (i) i.value = (voice.finalText + ' ' + interim).trim();
    };
    voice.rec = r;
    return r;
  }
  function startListening() {
    if (!voiceSupported()) {
      toast('Voice input needs Safari / Chrome on this device');
      return;
    }
    stopSpeaking();
    const r = getRecognizer();
    if (!r) return;
    if (voice.listening) {
      try { r.stop(); } catch (e) {}
      return;
    }
    voice.finalText = '';
    try { r.start(); }
    catch (e) {
      try { r.stop(); } catch (_) {}
      setTimeout(() => { try { r.start(); } catch (e2) { toast('Could not start mic'); } }, 200);
    }
  }
  function stopListening() {
    const r = voice.rec;
    if (r && voice.listening) {
      try { r.stop(); } catch (e) {}
    }
  }
  function wireVoiceControls() {
    setSpeakUI();
    const mic = $('chatMic');
    const sp = $('chatSpeak');
    if (sp) {
      sp.onclick = () => {
        voice.speakOn = !voice.speakOn;
        localStorage.setItem('aegis_speak', voice.speakOn ? '1' : '0');
        if (!voice.speakOn) stopSpeaking();
        setSpeakUI();
        toast(voice.speakOn ? 'Harold will speak replies' : 'Harold voice off');
      };
    }
    if (mic) {
      // tap toggle works on mobile; press-hold also works on desktop
      let pressTimer = null;
      const down = (e) => {
        e.preventDefault();
        if (voice.listening) { stopListening(); return; }
        startListening();
      };
      mic.addEventListener('click', down);
    }
    if (!voiceSupported()) {
      if (mic) { mic.disabled = true; mic.title = 'Speech recognition not available in this browser'; }
    }
    if (!ttsSupported() && sp) {
      sp.disabled = true; sp.title = 'Speech synthesis not available';
    }
  }
  wireVoiceControls();

  function appendBubble(who, text, opts) {
    opts = opts || {};
    const stream = $('chatMsgs');
    if (!stream) return;
    const div = document.createElement('div');
    div.className = 'bubble ' + (who === 'you' ? 'you' : 'harold');
    if (who !== 'you') {
      const w = document.createElement('div');
      w.className = 'who';
      w.textContent = 'Harold';
      div.appendChild(w);
    }
    div.appendChild(document.createTextNode(text));
    stream.appendChild(div);
    stream.scrollTop = stream.scrollHeight;
    if (who !== 'you' && opts.speak !== false) speakHarold(text);
    return div;
  }

  async function sendChat() {
    const i = $('chatMsg');
    const t = (i.value || '').trim();
    if (!t) return;
    stopSpeaking();
    stopListening();
    i.value = '';
    appendBubble('you', t);
    const stream = $('chatMsgs');
    const thinking = document.createElement('div');
    thinking.className = 'typing';
    thinking.innerHTML = '<i></i><i></i><i></i>';
    stream.appendChild(thinking);
    stream.scrollTop = stream.scrollHeight;
    $('chatSend').disabled = true;
    try {
      const d = await api('/api/admin/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: state.adminId, content: t, message: t })
      });
      thinking.remove();
      appendBubble('harold', d.content || '…');
    } catch (e) {
      thinking.remove();
      appendBubble('harold', 'Line dropped. Say that again.');
    }
    $('chatSend').disabled = false;
    i.focus();
  }

  $('chatSend').onclick = sendChat;
  $('chatMsg').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  async function renderMore() {
    content.innerHTML = '<div class="skeleton"></div>';
    const d = await loadDash();
    const hands = d.pending_handoffs || [];
    const clients = d.clients || [];
    const docs = d.documents || [];

    let html = '<div class="card"><div class="sec-head"><h3>Handoffs</h3></div>';
    if (!hands.length) {
      html += '<div class="empty" style="padding:18px"><h4 style="font-size:14px">None waiting</h4>' +
        'When a prospect closes on the public chat, they land here for you to take over.</div>';
    } else {
      hands.forEach(h => {
        html += '<div class="person" style="padding:10px 0;border-top:1px solid var(--line)">' +
          '<div class="av">✓</div><div><div class="name">' + esc(h.company || 'Prospect') + '</div>' +
          '<div class="sub">' + esc(h.email || '') + '</div></div>' +
          '<div class="price">£' + Number(h.price||0).toLocaleString() + '/year</div></div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><div class="sec-head"><h3>Clients</h3></div>';
    if (!clients.length) {
      html += '<div class="empty" style="padding:18px"><h4 style="font-size:14px">No paid clients yet</h4>' +
        'Your first activated annual licence will show here.</div>';
    } else {
      clients.forEach(c => {
        html += '<div class="person" style="padding:10px 0;border-top:1px solid var(--line)">' +
          '<div class="av">' + esc(String(c.company||'?')[0]||'?') + '</div>' +
          '<div><div class="name">' + esc(c.company) + '</div><div class="sub">' + esc(c.email||'') + '</div></div>' +
          '<div class="price">£' + Number(c.price||0).toLocaleString() + '<span style="color:var(--dim);font-weight:500">/year</span></div></div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><div class="sec-head"><h3>Documents</h3></div>';
    if (!docs.length) {
      html += '<p style="font-size:13px;color:var(--muted);line-height:1.5">No documents yet. Ask Harold to draft a product summary or report outline.</p>';
    } else {
      docs.forEach(doc => {
        html += '<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px">' + esc(doc.name) + '</div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><div class="sec-head"><h3>System</h3></div>' +
      '<div style="font-size:13px;line-height:1.7;color:var(--muted)">' +
      'Brain: <b style="color:' + (d.brain_online?'var(--green)':'var(--red)') + '">' + (d.brain_online?'Online':'Offline') + '</b><br>' +
      'Memories: ' + (d.memory_count||0) + '<br>' +
      'Mailboxes: ' + ((d.mail||{}).total||0) + ' messages<br>' +
      'Public chat: <a href="/chat" style="color:var(--green)" target="_blank" rel="noopener">open ↗</a>' +
      '</div></div>';

    content.innerHTML = html;
  }

  async function establishSession() {
    const response = await fetch('/api/admin/session');
    if (!response.ok) return false;
    const session = await response.json();
    state.csrfToken = session.csrf_token || '';
    $('loginGate').hidden = true;
    switchTab('home');
    return true;
  }

  $('loginForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const button = $('loginButton');
    const error = $('loginError');
    button.disabled = true;
    button.textContent = 'Signing in…';
    error.textContent = '';
    try {
      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: $('ownerPassword').value})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(
        data.error === 'too_many_attempts' ? 'Too many attempts. Try again later.' :
        data.error === 'owner_login_not_configured' ? 'Owner login has not been configured.' :
        'That password was not accepted.'
      );
      state.csrfToken = data.csrf_token || '';
      $('ownerPassword').value = '';
      $('loginGate').hidden = true;
      switchTab('home');
    } catch (err) {
      error.textContent = err.message || 'Sign-in failed.';
    } finally {
      button.disabled = false;
      button.textContent = 'Sign in securely';
    }
  });

  establishSession().catch(() => {});
  setInterval(() => {
    if ($('loginGate').hidden) loadDash().catch(() => {});
  }, 45000);
})();
</script>
